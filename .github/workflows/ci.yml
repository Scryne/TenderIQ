name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  backend:
    name: Backend — lint · tip · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderiq
          POSTGRES_PASSWORD: tenderiq
          POSTGRES_DB: tenderiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderiq -d tenderiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tenderiq:tenderiq@localhost:5432/tenderiq
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: uv kurulumu
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Bağımlılıklar
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy -p tenderiq_core -p tenderiq_api -p tenderiq_worker
      - name: Migration (upgrade head)
        run: uv run alembic upgrade head
      - name: Testler (pytest)
        run: uv run pytest
      - name: Entegrasyon testleri (testcontainers — RLS izolasyon kapısı)
        run: uv run pytest -m integration
      - name: AI regresyon kapısı (golden-set — BLOKE EDİCİ, Sprint 2.4)
        # E bölümü: kalite düşüşü pipeline'ı bloke eder. Sample fixture "geçer
        # baseline"dır; gerçek golden-set (private) çıktısı offline üretilip
        # bu eşiklerle ölçülür (bkz. evals/README.md). Eşikler başlangıç önerisi;
        # yayın öncesi Claude çıktısıyla yeniden kalibre edilir.
        run: >-
          uv run python evals/run_eval.py
          --golden evals/golden/sample --predictions evals/predictions/sample
          --gate --min-recall 0.8 --max-missed-mandatory 0.05

  contract:
    name: API sözleşme drift (OpenAPI→TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uv kurulumu
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: OpenAPI şemasını üret
        run: uv run python scripts/export_openapi.py
      - name: Drift kontrolü (şema commit'lenenle aynı olmalı)
        run: git diff --exit-code -- packages/api-client/openapi.json

  frontend:
    name: Frontend — lint · tip · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pnpm kurulumu
        uses: pnpm/action-setup@v4
      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile
      - name: api-client tiplerini üret (OpenAPI→TS)
        run: pnpm --filter @tenderiq/api-client generate
      - name: api-client drift kontrolü (üretilen tip commit'lenenle aynı olmalı)
        run: git diff --exit-code -- packages/api-client/src/schema.d.ts
      - name: Lint (eslint)
        run: pnpm --filter @tenderiq/web lint
      - name: api-client tip denetimi
        run: pnpm --filter @tenderiq/api-client typecheck
      - name: Build (Next.js — tip denetimi dâhil)
        run: pnpm --filter @tenderiq/web build
      - name: Web tip denetimi (tsc)
        run: pnpm --filter @tenderiq/web typecheck

  e2e:
    name: E2E — tarayıcı akışları (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderiq
          POSTGRES_PASSWORD: tenderiq
          POSTGRES_DB: tenderiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderiq -d tenderiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Migration'lar ayrıcalıklı rolle uygulanır; uygulama RLS'ye TABİ rolle
      # bağlanır (ADR-0003). E2E'nin üretimdeki yetkilerle koşması şart:
      # owner rolüyle koşan bir E2E, politikaların çalıştığını kanıtlamaz.
      DATABASE_ADMIN_URL: postgresql+psycopg://tenderiq:tenderiq@localhost:5432/tenderiq
      DATABASE_URL: postgresql+psycopg://tenderiq_app:tenderiq_app@localhost:5432/tenderiq
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: uv kurulumu
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: pnpm kurulumu
        uses: pnpm/action-setup@v4
      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Bağımlılıklar (python)
        run: uv sync --frozen
      - name: Bağımlılıklar (node)
        run: pnpm install --frozen-lockfile
      - name: Migration (ayrıcalıklı rolle)
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_ADMIN_URL }}
      - name: Uygulama rolü (RLS'ye tabi)
        run: |
          psql "postgresql://tenderiq:tenderiq@localhost:5432/tenderiq" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE tenderiq_app LOGIN PASSWORD 'tenderiq_app';
          GRANT USAGE ON SCHEMA public TO tenderiq_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO tenderiq_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO tenderiq_app;
          SQL
      - name: Web derlemesi (E2E `next start` ile koşar)
        run: pnpm --filter @tenderiq/web build
      - name: Playwright tarayıcısı
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
      - name: Hata izleri (yalnız düşerse)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
          retention-days: 7

  security:
    name: Güvenlik taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (sır taraması)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --no-banner --redact
      - name: uv kurulumu
        uses: astral-sh/setup-uv@v4
      - name: Bağımlılık denetimi (pip-audit — BLOKE EDİCİ)
        # J.2 #7: eskiden `|| true` ile koşuyordu, yani hiçbir şeyi engellemiyordu.
        # Artık bulgu merge'i bloke eder. Düzeltilemeyen açıklar
        # .github/pip-audit-ignore.txt'ye GEREKÇESİYLE yazılır.
        run: |
          uv export --frozen --no-dev --no-emit-workspace -o /tmp/req.txt \
            || uv export --frozen --no-dev -o /tmp/req.txt

          ignores=()
          while read -r line; do
            id="${line%%#*}"          # satır sonu yorumunu at
            id="$(echo "$id" | tr -d '[:space:]')"
            [ -n "$id" ] && ignores+=(--ignore-vuln "$id")
          done < <(grep -v '^[[:space:]]*#' .github/pip-audit-ignore.txt || true)

          if [ ${#ignores[@]} -gt 0 ]; then
            echo "İstisna sayısı: $(( ${#ignores[@]} / 2 ))"
          fi
          uvx pip-audit -r /tmp/req.txt "${ignores[@]}"

      - name: Trivy — bağımlılık + yapılandırma taraması (BLOKE EDİCİ)
        # pip-audit yalnız Python paketlerini görür; trivy npm/pnpm kilidini ve
        # Dockerfile yanlış yapılandırmalarını da kapsar. `secret` tarayıcısı
        # bilinçli KAPALI: sır taraması yukarıda gitleaks ile zaten yapılıyor.
        # Resmî imajla koşulur (gitleaks ile aynı desen) — action sürüm etiketine
        # bağımlılık yok ve yerelde birebir aynı komut doğrulanabiliyor.
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo:ro"
          aquasec/trivy:latest fs /repo
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile /repo/.github/trivyignore
          --skip-dirs node_modules --skip-dirs .venv
          --timeout 15m
          --exit-code 1

  image-scan:
    name: İmaj taraması (trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: İmajı derle
        # Yalnız tarama için; registry'ye push edilmez.
        run: >-
          docker build -f infra/docker/${{ matrix.image }}.Dockerfile
          -t tenderiq-${{ matrix.image }}:ci .
      - name: Trivy (imaj — taban imaj + çalışma zamanı CVE'leri)
        # Docker soketi bağlanır ki trivy yerel imaj deposundan okusun
        # (imaj registry'ye push edilmiyor).
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${{ github.workspace }}/.github:/cfg:ro"
          aquasec/trivy:latest image tenderiq-${{ matrix.image }}:ci
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile /cfg/trivyignore
          --timeout 15m
          --exit-code 1

  # NOT: AI golden-set regresyon kapısı backend job'ında BLOKE EDİCİ koşuyor
  # (Sprint 2.4, --gate + sample fixture). Gerçek golden-set (private) çıktısı
  # offline üretilip aynı eşiklerle ölçülür; kalite düşüşü merge'i engeller.
